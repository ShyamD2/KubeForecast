# Default values for predictive-scheduler (Dev Environment)

global:
  imageRegistry: "123456789012.dkr.ecr.us-east-1.amazonaws.com"
  imagePullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: "predictive-scheduler-sa"
  annotations:
    # Set by Terraform IRSA in AWS deployment
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/predictive-scheduler-irsa-role

webhook:
  enabled: true
  replicaCount: 2
  image:
    repository: "predictive-webhook"
    tag: "latest"
  port: 8443
  metricsPort: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

controller:
  enabled: true
  replicaCount: 1
  image:
    repository: "predictive-controller"
    tag: "latest"
  metricsPort: 8080
  simulationInterval: "15m"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  eviction:
    enabled: false # Safe by default
    maxPodsPerHour: 2
    maxConcurrentEvictions: 1
    minAvailableCapacityPct: 0.20
    cooldown: "15m"
  s3:
    bucket: ""
    region: "us-east-1"

scheduler:
  enabled: true
  replicaCount: 1
  image:
    repository: "predictive-scheduler"
    tag: "latest"
  metricsPort: 10259
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

waterline:
  cpuWeight: 0.30
  memoryWeight: 0.30
  consolidationWeight: 0.20
  disruptionWeight: 0.15
  historicalWeight: 0.05
  targetUtilizationThreshold: 0.75
  candidateDrainThreshold: 0.40
  minNodesFloor: 2

serviceMonitor:
  enabled: true
  interval: "30s"

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
