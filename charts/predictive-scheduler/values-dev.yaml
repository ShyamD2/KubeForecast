# AWS Dev Environment Values for KubeForecast Predictive Scheduler

global:
  imageRegistry: "197550036081.dkr.ecr.us-east-1.amazonaws.com"
  imagePullPolicy: Always

serviceAccount:
  create: true
  name: "predictive-scheduler-sa"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::197550036081:role/dev-predictive-scheduler-irsa"

webhook:
  enabled: true
  replicaCount: 2
  image:
    repository: "dev-predictive-webhook"
    tag: "v1"
  port: 8443
  metricsPort: 8080
  caBundle: ""

controller:
  enabled: true
  replicaCount: 1
  image:
    repository: "dev-predictive-controller"
    tag: "v1"
  metricsPort: 8080
  simulationInterval: "5m"
  s3:
    bucket: "dev-predictive-snapshots-20260906061030386700000001"
    region: "us-east-1"
  eviction:
    enabled: false
    maxPodsPerHour: 2
    maxConcurrentEvictions: 1
    minAvailableCapacityPct: 0.20
    cooldown: "15m"

scheduler:
  enabled: true
  replicaCount: 1
  image:
    repository: "dev-predictive-scheduler"
    tag: "v2"
  metricsPort: 10259

waterline:
  cpuWeight: 0.30
  memoryWeight: 0.30
  consolidationWeight: 0.20
  disruptionWeight: 0.15
  historicalWeight: 0.05
  targetUtilizationThreshold: 0.75

serviceMonitor:
  enabled: false

