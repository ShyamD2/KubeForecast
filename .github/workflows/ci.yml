name: CI / Security & Infrastructure Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-test:
    name: Go Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Format Check
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Benchmark Simulation Execution
        run: go run ./cmd/simulator/main.go --scenario all --output-dir ./experiments/results

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Validate Dev Environment
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Validate Experiment Environment
        run: |
          cd terraform/environments/experiment
          terraform init -backend=false
          terraform validate

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Chart
        run: helm lint ./charts/predictive-scheduler

  docker-build:
    name: Docker Multi-Stage Build & Security Scan
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Webhook Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.webhook
          push: false
          tags: predictive-webhook:test

      - name: Build Simulator Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.simulator
          push: false
          tags: predictive-simulator:test

      - name: Build Controller Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.controller
          push: false
          tags: predictive-controller:test

      - name: Build Scheduler Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.scheduler
          push: false
          tags: predictive-scheduler:test
